sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
tests:
  sample.zenbedded.transport.build:
    build_only: true
    platform_allow:
      - native_sim/native/64
      - esp32s3_devkitc/esp32s3/procpu
  sample.zenbedded.transport.asan:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ASAN=y
      - CONFIG_UBSAN=y
  # 3. The actual E2E Pytest Execution (Simulator Only)
  sample.zenbedded.transport.e2e:
    platform_allow:
      - native_sim/native/64
    harness: pytest
    harness_config:
      pytest_dut_scope: function
      pytest_args:
        - '-p'
        - 'no:launch_testing_ros'
        - '-p'
        - 'no:launch_testing'
