sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
  build_only: true
tests:
  sample.zenbedded.zenbedded_test_node:
    platform_allow:
      - native_sim/native/64
      - esp32s3_devkitc/esp32s3/procpu
  sample.zenbedded.zenbedded_test_node.asan:
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ASAN=y
      - CONFIG_UBSAN=y
