sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
tests:
  sample.zenbedded.zenbedded_test_node:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SUCCESS: JointState payload extracted cleanly."
        - "SUCCESS: JointCommand payload extracted cleanly."
    platform_allow:
      - native_sim
      - esp32s3_devkitc/esp32s3/procpu
