sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "SUCCESS: JointState payload extracted cleanly."
      - "SUCCESS: JointCommand payload extracted cleanly."
tests:
  sample.zenbedded.zenbedded_test_node:
    platform_allow:
      - native_sim/native/64
      - esp32s3_devkitc/esp32s3/procpu
  sample.zenbedded.zenbedded_test_node.asan:
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ASAN=y
      - CONFIG_UBSAN=y
